<style>
  :root {
    --bg: #080910;
    --surface: #0F1018;
    --card: #141620;
    --primary: #5B4FE8;
    --primary-light: #7B6FF8;
    --gold: #D4AF6A;
    --text: #FFFFFF;
    --text-secondary: #8A8FAA;
    --text-muted: #4A4F6A;
    --border: #232639;
    --green: #4CAF7D;
    --red: #E0706C;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.6;
  }
  .wrap { max-width: 900px; margin: 0 auto; padding: 48px 24px 96px; }
  .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .brand-dot {
    width: 12px; height: 12px; border-radius: 3px;
    background: linear-gradient(135deg, var(--primary-light), var(--gold));
  }
  .brand-name {
    font-weight: 700; letter-spacing: 0.06em; color: var(--text);
    font-size: 14px; text-transform: uppercase;
  }
  h1 { font-size: 24px; margin: 18px 0 4px; font-weight: 600; }
  .subtitle { color: var(--text-muted); font-size: 13px; margin-bottom: 32px; }

  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; align-items: start; }
  @media (max-width: 820px) { .cols { grid-template-columns: 1fr; } }

  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    padding: 24px; margin-bottom: 24px;
  }
  .card h2 {
    font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase;
    color: var(--text-secondary); margin: 0 0 14px;
  }
  label { display: block; font-size: 13px; color: var(--text-secondary); margin-bottom: 8px; }
  input[type="text"], textarea {
    width: 100%;
    background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
    color: var(--text); font-size: 13.5px;
    padding: 12px 14px; line-height: 1.5;
  }
  input[type="text"] { margin-bottom: 18px; }
  textarea { resize: vertical; font-family: Consolas, Menlo, monospace; }
  #body { min-height: 260px; }
  #emails { min-height: 140px; }
  input[type="text"]:focus, textarea:focus { outline: none; border-color: var(--primary-light); }
  .hint { color: var(--text-muted); font-size: 12px; margin-top: 8px; }

  .btn {
    display: inline-block; margin-top: 18px;
    background: linear-gradient(135deg, var(--primary), var(--primary-light));
    color: #fff; border: none; border-radius: 8px;
    padding: 12px 28px; font-size: 14px; font-weight: 600;
    cursor: pointer; letter-spacing: 0.02em;
  }
  .btn:hover { filter: brightness(1.08); }

  /* live preview, styled like an actual received email */
  .preview-shell {
    background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
    overflow: hidden; position: sticky; top: 24px;
  }
  .preview-meta {
    padding: 14px 18px; border-bottom: 1px solid var(--border); font-size: 12.5px;
    color: var(--text-muted);
  }
  .preview-meta b { color: var(--text-secondary); }
  .preview-subject {
    padding: 14px 18px; font-size: 15px; font-weight: 600; color: var(--text);
    border-bottom: 1px solid var(--border); word-break: break-word;
  }
  .preview-body {
    padding: 18px; font-size: 13.5px; color: #d8dae8; max-height: 460px; overflow-y: auto;
  }
  .preview-body a { color: var(--primary-light); }
  .preview-body p { margin: 0 0 12px; }

  .banner { border-radius: 8px; padding: 14px 16px; font-size: 13.5px; margin-bottom: 20px; }
  .banner.error { background: rgba(224,112,108,0.1); border: 1px solid rgba(224,112,108,0.35); color: var(--red); }

  .result-list { list-style: none; padding: 0; margin: 10px 0 0; font-size: 13px; }
  .result-list li { padding: 4px 0; color: var(--text-secondary); font-family: Consolas, Menlo, monospace; }
  .result-list li.fail { color: var(--red); }
  .count-row { display: flex; gap: 24px; margin-bottom: 6px; }
  .count-row .n { font-size: 22px; font-weight: 700; }
  .count-row .l { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; }

  .status-pill { display:inline-block; font-size:11px; padding:2px 8px; border-radius:999px; text-transform:uppercase; letter-spacing:.05em; }
  .st-pending, .st-sending { background:rgba(212,175,106,.12); color:var(--gold); }
  .st-sent { background:rgba(76,175,125,.12); color:var(--green); }
  .st-failed { background:rgba(224,112,108,.12); color:var(--red); }
  .st-skipped { background:rgba(138,143,170,.12); color:var(--text-secondary); }
  table.rows { width:100%; border-collapse:collapse; font-size:13px; }
  table.rows td { padding:7px 8px; border-bottom:1px solid var(--border); vertical-align:top; }
  table.rows td.addr { font-family: Consolas, Menlo, monospace; color: var(--text-secondary); }
  table.rows td.note { color: var(--text-muted); font-size:12px; }
  .history a { color: var(--primary-light); text-decoration:none; }
  .history li { padding:4px 0; font-size:13px; color: var(--text-secondary); }
  #already_received { min-height: 90px; }
  a.btn { text-decoration:none; }
</style>
